{% extends 'base.html' %}
{% block content %}
<div class="container">
    {% for item in portfolio %}
    <h3>{{ item.name }}</h3>
    <p>{{ item.bio }}</p>
    <p>{{ item.email }}</p>

    <a href="{% url 'updateinfo' item.id %}">Update</a>
{% empty %}
    <p>No portfolio information added yet.</p>
{% endfor %}
</div>

{% endblock content %}
