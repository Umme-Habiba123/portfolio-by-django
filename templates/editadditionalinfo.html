{% extends 'base.html' %}

{% block content %}

<div class="container my-5">

    <h2>Edit Additional Information</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update
        </button>

        <a href="{% url 'updateinfo' portfolio.id %}"
           class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock content %}
