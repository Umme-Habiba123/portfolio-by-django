{% extends 'base.html' %}

{% block content %}

<div class="container my-5">

    <div class="card p-4">

        <h2 class="mb-4">Add Additional Information</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Information Name</label>
                {{ form.field_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Information Value</label>
                {{ form.value }}
            </div>

            <button type="submit" class="btn btn-success">
                Save Information
            </button>

            <a href="{% url 'updateinfo' portfolio.id %}"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

{% endblock content %}
